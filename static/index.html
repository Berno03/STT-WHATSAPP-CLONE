<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Coda Trascrizioni</title>
</head>
<body>
    <div style="max-width: 800px; margin: 0 auto; padding: 20px; font-family: Arial;">
        <h1>Dashboard Trascrizioni Asincrone</h1>
        <p>Registra i tuoi audio. Il server li elaborerà in backround.</p>
        <!-- PULSANTGE REGISTRAZIONE-->
         <div style="text-align: center; margin-bottom: 40px;">
            <button id="recordButton" style="padding : 15px; font-size: 16px; cursor: pointer;">
                Clicca per iniziare a registrare!
            </button>
         </div>
         <!-- SEZIONE DELLA CODA (TABELLA)-->
          <h2>Lavori in coda</h2>
          <table border="1" width="100%" style="border-collapse: collapse; text-align: left;"> 
            <thead>
                <tr>
                    <th style="padding: 10px;">ID</th>
                    <th style="padding: 10px;">Stato</th>
                    <th style="padding: 10px;">Testo Trascritto</th>    
                </tr>
            </thead>
            <tbody id="queueBody">
            </tbody>
        </table>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
