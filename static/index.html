<!DOCTYPE html>
<html lang="it">
<head>
    <title>Trying2UnderstandU</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>

        /* Sfondo e Container */

        body {  
            
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            background-color: #98ccfcde; 
            margin: 0;
            padding:20px;

        
        }
        .container { 

            background-color: rgb(194, 232, 255); 
            border-radius: 20px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
            margin: 0 auto;
            max-width: 600px;
                         
        }
        /* Titolo e Paragrafi */
        h1 {
            text-align: center;
            font-size: 40px;
            color: #05212b;
        }
        p {
            font-size: 20px;
            text-align: center;
            color: #24869e ;
            margin-bottom: 40px;


        }

        /* Pulsante di Registrazione */

        #recordButton {

            display: block;
            margin: 0 auto 30px auto;
            padding: 15px 20px;
            font-size: 16px;
            border: none;
            background-color: #0b5e7c;
            border-radius: 20px;
            transition: background-color 0.3s;

        }

        /* Se ci passi sopra*/

        #recordButton:hover { 
            background-color: #24869e;
        
        } 
        
        /* Se stai registrando */

        #recordButton.recording { 
            background-color: #c0392b; 
            color: #fff; 
        }

        /* Se ci passi sopra mentre stai registrando*/
        #recordButton.recording:hover { 
            background-color: #e74c3c; 
        } 
        
        /* Chat */

        .chat-box{
            
            border-radius: 15px;
            background-color: rgb(31, 65, 73);
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border: 5px solid #3f86a1;

        }

        /* Bolla del messaggio */

        .message-bubble {

            align-self: flex-end;
            max-width: 80%;
            background-color: #E3F2FD; /* Blu pastello morbidissimo e luminoso */
            color: #111111; /* Testo scuro per ottima leggibilità */
            padding: 14px 18px;
            border-radius: 20px 20px 4px 20px; /* Codina elegante in basso a destra */
            box-shadow: 0 2px 6px rgba(0,0,0,0.04); /* Ombra leggerissima */
            border: 1px solid rgba(0,0,0,0.03); 
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* Etichetta audio */

        .audio-label { 
            font-size: 11px; 
            font-weight: 700; 
            color: #1976D2; /* Blu oceano per fare contrasto */
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
            display: flex;
            align-items: center;

        }

        .audio-player { 
            height: 30px;
            width: 100%;
            outline: none;
            margin-top: 5px; 
        }
        
        .toggle-btn { 
            background-color: #1976D2; 
            color: white; 
            border: none; 
            padding: 8px 12px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 13px;
            align-self: flex-start;
        }

        .transcription-box { 
            background-color: #E3F2FD; 
            padding: 10px; 
            border-radius: 12px; 
            margin-top: 10px; 
        }

        .transcription-text { 
            font-size: 15px; 
            line-height: 1.5; 
            color: #2c3e50; /* Grigio-blu scurissimo, molto elegante */
        }

        .status-indicator { 
            font-size: 13px; 
            color: #388E3C; /* Verde scuro per indicare successo */
            margin-top: 8px; 
            align-self: flex-start;
        }


   </style>
</head>
<body>
    
    <div class = "container">
        <h1>Trying2UnderstandU</h1>
        <p>Registra i tuoi audio. Proverò a capirti!!</p>
        <!-- PULSANTGE REGISTRAZIONE-->
        <button id="recordButton" >
                🎤
        </button>
        <!-- SEZIONE DELLA CHAT -->
        <div id="chatBox" class="chat-box">

        </div>

        <details class="queue-panel">
        <summary>Coda di lavoro</summary>
            <ul>
                <li>In coda: <span id="count-queued">0</span></li>
                <li>In elaborazione: <span id="count-processing">0</span></li>
                <li>Completati: <span id="count-done">0</span></li>
                <li>Falliti: <span id="count-error">0</span></li>
            </ul>
            <ul id="job-list">
                <!-- Qui verranno aggiunti i lavori -->
            </ul>
        </details>
    </div>

    <script src="/static/app.js?v=9" defer></script> <!-- ?v=2 per cancellare ogni volta le cache-->


</body>
</html>
